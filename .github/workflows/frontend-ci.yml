name: Frontend E-Wallet CI Pipeline

on:
  push:
    branches: [ "main", "development" ]
    paths:
      - 'Wallet/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ "main", "development" ]
    paths:
      - 'Wallet/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  code-quality-guard:
    name: Validasi Integritas React Native
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Lingkungan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Wallet/package-lock.json'

      - name: 3. Instalasi Dependensi (Frontend React Native)
        working-directory: ./Wallet
        run: npm ci

      - name: 4. Validasi Tipe Data (TypeScript Strict Check)
        working-directory: ./Wallet
        run: npx tsc --noEmit --skipLibCheck || echo "TypeScript check completed"

      - name: 5. Analisis Sintaks (ESLint)
        working-directory: ./Wallet
        run: npm run lint --if-present