name: Backend E-Wallet CI Pipeline

on:
  push:
    branches: [ "main", "development" ]
    paths:
      - 'e-wallet-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main", "development" ]
    paths:
      - 'e-wallet-backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    name: Eksekusi Test & Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Lingkungan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'e-wallet-backend/package-lock.json'

      - name: 3. Instalasi Dependensi (Backend)
        working-directory: ./e-wallet-backend
        run: npm ci

      # 🚀 INTEGRASI TEST FASE 2: Menjalankan Jest Integration Test di RAM CI
      - name: 4. Eksekusi Integration Test (Jest & Supertest)
        working-directory: ./e-wallet-backend
        env:
          NODE_ENV: test
          JWT_SECRET: github_actions_ci_access_secret_2026
          JWT_REFRESH_SECRET: github_actions_ci_refresh_secret_2026
          USE_TRANSACTIONS: false
        run: npm test