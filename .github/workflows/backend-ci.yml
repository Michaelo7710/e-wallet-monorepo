name: Backend E-Wallet CI Pipeline

on:
  push:
    branches:
      - "main"
      - "development"
      - "staging"
      - "feat/**"
    paths:
      - 'e-wallet-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - "main"
      - "development"
      - "staging"
      - "feat/**"
    paths:
      - 'e-wallet-backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    name: Backend CI & Automated Regression Suite
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Runtime (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'e-wallet-backend/package-lock.json'

      - name: 3. Install Clean Dependencies
        working-directory: ./e-wallet-backend
        run: npm ci

      # 🧪 EKSEKUSI PENGUJIAN OTOMATIS BERKUALITAS ENTERPRISE
      - name: 4. Execute Jest Integration & Unit Suites with Coverage
        working-directory: ./e-wallet-backend
        env:
          NODE_ENV: test
          JWT_SECRET: github_actions_ci_access_secret_2026
          JWT_REFRESH_SECRET: github_actions_ci_refresh_secret_2026
          USE_TRANSACTIONS: false
        run: npm test -- --coverage

      - name: 5. Archive Coverage Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: e-wallet-backend/coverage/
          retention-days: 14